#import './fragments.graphql'

query getDiagnosesExclusions(
  $algorithmId: ID!
  $after: String
  $before: String
  $first: Int
  $last: Int
  $searchTerm: String
) {
  getDiagnosesExclusions(
    algorithmId: $algorithmId
    after: $after
    before: $before
    first: $first
    last: $last
    searchTerm: $searchTerm
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      endCursor
      startCursor
    }
    totalCount
    edges {
      node {
        id
        excludingNode {
          id
          fullReference
          labelTranslations {
            ...HstoreLanguages
          }
        }
        excludedNode {
          id
          fullReference
          labelTranslations {
            ...HstoreLanguages
          }
        }
      }
    }
  }
}

query getHealthCaresExclusions(
  $projectId: ID!
  $type: NodeExclusionTypeEnum!
  $after: String
  $before: String
  $first: Int
  $last: Int
  $searchTerm: String
) {
  getHealthCaresExclusions(
    projectId: $projectId
    type: $type
    after: $after
    before: $before
    first: $first
    last: $last
    searchTerm: $searchTerm
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      endCursor
      startCursor
    }
    totalCount
    edges {
      node {
        id
        excludingNode {
          id
          fullReference
          isDeployed
          labelTranslations {
            ...HstoreLanguages
          }
        }
        excludedNode {
          id
          fullReference
          isDeployed
          labelTranslations {
            ...HstoreLanguages
          }
        }
      }
    }
  }
}

mutation createNodeExclusions($params: [NodeExclusionInput!]!) {
  createNodeExclusions(input: { params: $params }) {
    nodeExclusions {
      id
    }
  }
}

mutation destroyNodeExclusion($excludingNodeId: ID!, $excludedNodeId: ID!) {
  destroyNodeExclusion(
    input: {
      excludingNodeId: $excludingNodeId
      excludedNodeId: $excludedNodeId
    }
  ) {
    id
  }
}
